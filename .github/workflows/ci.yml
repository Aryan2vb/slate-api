name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: slate, POSTGRES_PASSWORD: slate, POSTGRES_DB: slate }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U slate" --health-interval 2s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://slate:slate@localhost:5432/slate
      DATABASE_URL: postgresql+asyncpg://slate:slate@localhost:5432/slate
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
